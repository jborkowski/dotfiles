# --- Setup on a new Mac ---
# 1. Generate an Apple app-specific password:
#    https://account.apple.com/account/manage
#    Sign-In and Security > App-Specific Passwords > Generate Password.
#    Two-factor authentication must be enabled on the Apple Account.
# 2. Add the generated password to this Mac's local Keychain:
#    security add-generic-password -a jonatan.borkowski@icloud.com -s himalaya-icloud -U -w
#    Enter the app-specific password when prompted. Do not put it in this file.
# 3. Verify the account and list email:
#    himalaya account list
#    himalaya envelope list
# Apple documentation: https://support.apple.com/en-us/102654
