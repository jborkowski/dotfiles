# Himalaya CLI Email Configuration (v2.0)
# Config managed via ~/.dotfiles/himalaya and GNU stow

# --- Default Account: iCloud ---
[accounts.icloud]
email = "jonatan.borkowski@icloud.com"

[accounts.icloud.mailbox]
alias.inbox = "INBOX"

[accounts.icloud.imap]
server = "imap.mail.me.com:993"

[accounts.icloud.imap.sasl.plain]
username = "jonatan.borkowski@icloud.com"
passwd.cmd = "security find-generic-password -s himalaya-icloud -w"

[accounts.icloud.smtp]
server = "smtp://smtp.mail.me.com:587"
starttls = true

[accounts.icloud.smtp.sasl.plain]
username = "jonatan.borkowski@icloud.com"
passwd.cmd = "security find-generic-password -s himalaya-icloud -w"

